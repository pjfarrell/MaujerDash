<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Trains</title>
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <script src="/vendor/leaflet/leaflet.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #111;
      --surface: #1b1b1b;
      --border:  #2c2c2c;
      --red:     #e03131;
      --yellow:  #f5a623;
      --green:   #6cbe45;
      --white:   #f0f0f0;
      --muted:   #5a5a5a;
      --dim:     #8a8a8a;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    header h1 {
      font-size: clamp(1rem, 3.5vw, 1.4rem);
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .meta {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 10px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    .weather { color: var(--dim); }
    .weather::before { content: '·'; margin-right: 10px; color: var(--muted); }
    .focus-now .weather::before { margin-right: 8px; }

    button.weather {
      font: inherit;
      font-size: 0.82rem;
      background: none;
      border: none;
      border-radius: 0;
      padding: 0;
      letter-spacing: inherit;
    }
    button.weather:hover { color: var(--white); }

    /* Day forecast widget */
    .wx-panel {
      max-width: 640px;
      margin: 12px auto 0;
      padding: 12px 14px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      text-align: left;
    }

    .wx-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      font-size: 0.76rem;
      color: var(--dim);
    }
    .wx-head .wx-temp { font-size: 1.3rem; font-weight: 800; color: var(--white); }
    .wx-head .muted { color: var(--muted); font-size: 0.7rem; }

    .wx-hours {
      display: flex;
      gap: 2px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .wx-hour {
      flex: 0 0 auto;
      width: 46px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 5px 2px;
      border-radius: 8px;
      font-variant-numeric: tabular-nums;
    }
    .wx-hour.now { background: rgba(240, 240, 240, 0.08); }
    .wx-hour.now .wx-label { color: var(--white); font-weight: 700; }

    .wx-temp-h { font-size: 0.72rem; font-weight: 700; color: var(--white); line-height: 1.2; }

    /* The bar grows upward inside a fixed-height track, so a warmer hour is the
       only thing that raises it and every row below stays on one line. */
    .wx-track {
      height: 40px;
      width: 7px;
      display: flex;
      align-items: flex-end;
      flex: 0 0 auto;
    }

    .wx-bar {
      width: 100%;
      border-radius: 99px;
      background: linear-gradient(to top, #3b82f6, var(--yellow));
      opacity: 0.75;
    }
    .wx-hour.now .wx-bar { opacity: 1; }

    .wx-icon { font-size: 0.86rem; line-height: 1.2; height: 1.2em; }
    .wx-label { font-size: 0.6rem; color: var(--muted); white-space: nowrap; line-height: 1.2; }
    .wx-precip {
      font-size: 0.58rem;
      color: #5b9bd5;
      height: 1.2em;
      line-height: 1.2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1px;
      white-space: nowrap;
    }
    .wx-drop { font-size: 0.52rem; }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    button, select, input {
      font: inherit;
      font-size: 0.78rem;
      color: var(--white);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 6px 14px;
      cursor: pointer;
    }
    button:hover, select:hover, input:focus { border-color: #444; }
    button:disabled { opacity: 0.5; cursor: default; }

    #location-note {
      margin-top: 10px;
      font-size: 0.72rem;
      color: var(--dim);
      letter-spacing: 0.02em;
    }
    #location-note.warn { color: var(--yellow); }

    /* Map */
    #map {
      /* body is a column flex container, so pin the height against shrinking */
      flex: 0 0 auto;
      height: clamp(240px, 42vh, 420px);
      width: 100%;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 0;
    }

    .leaflet-container { font: inherit; background: var(--surface); }

    /* Only the tiles are inverted; pins and the radius circle sit in other panes */
    .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) brightness(0.92) contrast(0.88) saturate(0.6);
    }

    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: var(--surface);
      color: var(--white);
      border: 1px solid var(--border);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
    }
    .leaflet-popup-content { margin: 10px 12px; font-size: 0.76rem; line-height: 1.45; }
    .leaflet-popup-content b { font-size: 0.84rem; }
    .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
    .leaflet-control-attribution {
      background: rgba(17, 17, 17, 0.8) !important;
      color: var(--muted) !important;
    }
    .leaflet-control-attribution a { color: var(--dim) !important; }
    .leaflet-bar a {
      background: var(--surface);
      color: var(--white);
      border-bottom-color: var(--border);
    }
    .leaflet-bar a:hover { background: #262626; color: var(--white); }

    /* Station pins carry the same badges as the list below */
    .station-pin { background: none; border: none; }
    .station-pin .pin-inner {
      display: flex;
      gap: 2px;
      padding: 3px;
      border-radius: 99px;
      background: rgba(17, 17, 17, 0.9);
      border: 1px solid var(--border);
      transition: transform 0.15s, border-color 0.15s;
      /* Leaflet anchors the icon's top-left at the coordinate, so centre the
         badge on it here — otherwise every pin sits down-right of its station,
         which at a small radius reads as being outside the circle. */
      transform: translate(-50%, -50%);
    }
    .station-pin .badge { width: 19px; height: 19px; font-size: 0.62rem; }
    .station-pin.active .pin-inner {
      transform: translate(-50%, -50%) scale(1.25);
      border-color: var(--white);
    }

    .origin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #3b82f6;
      border: 2px solid var(--white);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.3);
    }

    /* Station list, nearest first */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }

    .station {
      background: var(--bg);
      display: grid;
      grid-template-columns: 250px 1fr;
      scroll-margin-top: 12px;
    }
    .station.active { background: #17191c; }

    .station-head {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px 18px;
      border-right: 1px solid var(--border);
      background: var(--surface);
      cursor: pointer;
    }

    .station-dirs { display: flex; flex-direction: column; }

    @media (max-width: 720px) {
      .station { grid-template-columns: 1fr; }
      .station-head { border-right: none; border-bottom: 1px solid var(--border); }
    }

    /* Narrow screens: let the "showing stations near" label take its own line
       rather than squeezing the place name down to an ellipsis */
    @media (max-width: 480px) {
      .place-bar { flex-wrap: wrap; justify-content: center; padding-left: 6px; }
      .place-prefix { flex-basis: 100%; text-align: center; padding-top: 3px; }
    }

    .badges { display: flex; gap: 4px; flex-shrink: 0; }

    .badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    /* Express runs are signed as a diamond, same as on the platform */
    .badge.express { border-radius: 4px; transform: rotate(45deg); }
    .badge.express > span { display: block; transform: rotate(-45deg); }

    .station-name {
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .station-meta {
      font-size: 0.68rem;
      color: var(--dim);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .travel {
      margin-top: 5px;
      font-size: 0.66rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .travel b { color: var(--white); font-weight: 700; }

    /* Travel-method selector */
    .modes { display: inline-flex; gap: 0; }

    .modes button {
      border-radius: 0;
      padding: 6px 13px;
      border-left-width: 0;
    }
    .modes button:first-child { border-radius: 99px 0 0 99px; border-left-width: 1px; }
    .modes button:last-child { border-radius: 0 99px 99px 0; }
    .modes button[aria-pressed="true"] {
      background: var(--white);
      color: #111;
      border-color: var(--white);
    }

    .station.selected { background: #1a1f26; }
    .station.selected .station-head { box-shadow: inset 3px 0 0 #3b82f6; }

    #route-banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 9px 18px;
      font-size: 0.74rem;
      color: var(--white);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    #route-banner .muted { color: var(--muted); }
    #route-banner.warn { color: var(--yellow); }

    .rank {
      margin-left: auto;
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* Direction sections */
    .dir-section {
      padding: 12px 18px 14px;
      border-bottom: 1px solid var(--border);
      flex: 1;
    }
    .dir-section:last-child { border-bottom: none; }

    .dir-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 9px;
    }
    .dir-dest {
      font-weight: 400;
      letter-spacing: 0.05em;
      text-transform: none;
      color: #4a4a4a;
    }

    .trains {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 28px;
      align-items: center;
    }

    /* Arrival circles: each train is a vessel of liquid that drains from green
       to red as it approaches. --fill and --liquid are set per train in JS. */
    .train {
      position: relative;
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border-radius: 50%;
      overflow: hidden;
      border: 1.5px solid #333;
      background: rgba(240, 240, 240, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      cursor: pointer;
    }

    .train .liquid {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--fill, 0%);
      background: var(--liquid, var(--green));
      transition: height 0.9s ease, background-color 0.9s ease;
    }
    /* A lighter band at the top reads as the surface of the liquid */
    .train .liquid::before {
      content: '';
      position: absolute;
      inset: 0 0 auto 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.45);
    }

    .train-time, .train-route {
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
    }
    .train-time {
      font-size: 0.95rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--white);
    }
    .train-time.now { font-size: 0.72rem; letter-spacing: 0.02em; }

    .train-route {
      margin-top: 3px;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: rgba(255, 255, 255, 0.85);
    }
    .train-route.express::after { content: ' ◆'; font-size: 0.5rem; }

    /* A train you can no longer reach in time stays visible but steps back */
    .train.missed {
      opacity: 0.32;
      cursor: default;
      filter: grayscale(0.6);
    }

    .empty {
      color: var(--muted);
      font-size: 0.76rem;
      font-style: italic;
    }

    /* Focus session: the countdown takes the screen */
    #focus {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      text-align: center;
    }

    .focus-now {
      position: absolute;
      top: 16px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--dim);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }

    .focus-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .focus-line {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      max-width: 620px;
      font-size: 1rem;
      line-height: 1.5;
      color: var(--dim);
    }
    .focus-line b { color: var(--white); font-weight: 700; }
    .focus-line .badge { width: 24px; height: 24px; font-size: 0.78rem; }

    .focus-timer {
      font-size: clamp(3.5rem, 17vw, 11rem);
      font-weight: 800;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: var(--green);
      transition: color 0.6s;
    }
    .focus-timer.soon { color: var(--yellow); }
    .focus-timer.go   { color: var(--red); animation: pulse 1.4s ease-in-out infinite; }
    .focus-timer.gone { color: var(--muted); font-size: clamp(2rem, 8vw, 4rem); }

    @keyframes pulse { 50% { opacity: 0.45; } }

    .focus-train {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 1rem;
      font-weight: 700;
    }

    .focus-sub { font-size: 0.86rem; color: var(--dim); }
    .focus-math { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.03em; }

    .focus-modes { display: flex; gap: 6px; margin-top: 4px; }

    .focus-modes button {
      padding: 6px 16px;
      font-size: 0.74rem;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .focus-modes button b { font-variant-numeric: tabular-nums; }
    .focus-modes button[aria-pressed="true"] {
      background: var(--white);
      color: #111;
      border-color: var(--white);
    }
    .focus-modes button:disabled { opacity: 0.35; }

    #focus-map {
      width: min(720px, 100%);
      flex: 1 1 auto;
      min-height: 130px;
      max-height: 34vh;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
    }

    .focus-note { font-size: 0.64rem; color: var(--muted); font-style: italic; }

    #focus-exit { padding: 8px 22px; }

    @media (prefers-reduced-motion: reduce) {
      .focus-timer.go { animation: none; }
    }

    /* Footer */
    footer {
      padding: 9px 24px;
      text-align: center;
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 6px;
      background: var(--muted);
      vertical-align: middle;
      transition: background 0.4s;
    }
    .dot.ok  { background: var(--green); }
    .dot.err { background: var(--red); }

    /* Location picker */
    [hidden] { display: none !important; }

    .place-bar {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      max-width: 100%;
      padding: 5px 6px 5px 14px;
      border: 1px solid var(--border);
      border-radius: 99px;
      background: var(--surface);
    }

    .place-prefix {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--muted);
      white-space: nowrap;
    }

    .place-label {
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .place-label.default { color: var(--dim); font-weight: 400; font-style: italic; }

    .picker {
      max-width: 520px;
      margin: 12px auto 0;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      text-align: left;
    }

    .picker-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .picker-or {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: var(--muted);
    }

    #search-form { display: flex; gap: 6px; flex: 1; min-width: 220px; }

    #query {
      flex: 1;
      min-width: 0;
      border-radius: 8px;
      padding: 7px 12px;
      background: var(--bg);
    }
    #query::placeholder { color: var(--muted); }

    .results { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }

    .result {
      text-align: left;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.76rem;
      line-height: 1.35;
      background: var(--bg);
      white-space: normal;
    }
    .result .kind {
      display: block;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .results .empty { padding: 6px 2px; }

    /* Leaving checklist */
    .badge-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      padding: 0 4px;
      border-radius: 99px;
      background: var(--yellow);
      color: #111;
      font-size: 0.6rem;
      font-weight: 800;
      margin-left: 5px;
    }

    .checklist-panel {
      max-width: 480px;
      margin: 12px auto 0;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      text-align: left;
    }

    .checklist-panel h2 {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    #check-form { display: flex; gap: 6px; margin-bottom: 10px; }
    #check-input { flex: 1; min-width: 0; border-radius: 8px; padding: 7px 12px; background: var(--bg); }
    #check-input::placeholder { color: var(--muted); }

    .check-list { display: flex; flex-direction: column; gap: 1px; }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 6px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .check-item:hover { background: rgba(240, 240, 240, 0.04); }
    .check-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      padding: 0;
      border-radius: 4px;
      flex-shrink: 0;
      accent-color: var(--green);
      cursor: pointer;
    }
    .check-item span { flex: 1; word-break: break-word; }
    .check-item.done span { color: var(--muted); text-decoration: line-through; }
    .check-item button {
      padding: 2px 9px;
      border-radius: 99px;
      font-size: 0.72rem;
      flex-shrink: 0;
    }

    .check-empty { color: var(--muted); font-size: 0.78rem; font-style: italic; padding: 6px 2px; }

    /* Surfaced again right when it matters: the moment you're about to walk out.
       Chips rather than a sentence — a long list stays scannable, and each one
       can be ticked off without leaving the countdown. */
    .focus-checklist {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      max-width: 620px;
    }

    .focus-checklist .grab-label {
      font-size: 0.64rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-right: 2px;
    }

    .focus-checklist button {
      padding: 5px 13px;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--yellow);
      background: rgba(245, 166, 35, 0.1);
      border-color: rgba(245, 166, 35, 0.4);
      transition: color 0.2s, background-color 0.2s, border-color 0.2s;
    }
    .focus-checklist button:hover {
      color: #111;
      background: var(--yellow);
      border-color: var(--yellow);
    }
    .focus-checklist button:hover::after { content: ' ✓'; }

    /* Grabbed items stay on the row — the whole list remains visible, and green
       against yellow says at a glance how much is still outstanding. */
    .focus-checklist button.grabbed {
      color: var(--green);
      background: rgba(108, 190, 69, 0.12);
      border-color: rgba(108, 190, 69, 0.45);
    }
    .focus-checklist button.grabbed::before { content: '✓ '; }
    .focus-checklist button.grabbed:hover {
      color: #111;
      background: var(--green);
      border-color: var(--green);
    }
    .focus-checklist button.grabbed:hover::after { content: ''; }
  </style>
</head>
<body>

<header>
  <h1>Nearby Trains</h1>
  <div class="meta">
    <span id="clock"></span>
    <button id="weather" class="weather" hidden aria-expanded="false"
            title="Show today's forecast"></button>
  </div>

  <div class="wx-panel" id="wx-panel" hidden></div>
  <div class="controls">
    <span class="place-bar">
      <span class="place-prefix" id="place-prefix" hidden>Showing stations near</span>
      <span class="place-label" id="place-label">Locating&hellip;</span>
      <button id="change">Change</button>
    </span>
    <span class="modes" id="modes" role="group" aria-label="Travel method">
      <button data-mode="walk" aria-pressed="true">Walk</button>
      <button data-mode="bike" aria-pressed="false">Bike</button>
      <button data-mode="drive" aria-pressed="false">Drive</button>
    </span>
    <select id="radius" aria-label="Search radius">
      <option value="0.25">Within &frac14; mi</option>
      <option value="0.5">Within &frac12; mi</option>
      <option value="1">Within 1 mi</option>
      <option value="2">Within 2 mi</option>
    </select>
    <button id="checklist-toggle" aria-expanded="false" title="Things to grab before you leave">
      Checklist<span class="badge-count" id="check-badge" hidden></span>
    </button>
  </div>

  <div class="checklist-panel" id="checklist-panel" hidden>
    <h2>Before you leave</h2>
    <form id="check-form">
      <input id="check-input" type="text" autocomplete="off"
             placeholder="Add something to grab&hellip;" aria-label="New checklist item">
      <button type="submit">Add</button>
    </form>
    <div class="check-list" id="check-list"></div>
  </div>

  <div class="picker" id="picker" hidden>
    <div class="picker-row">
      <button id="locate">Use my location</button>
      <span class="picker-or">or</span>
      <form id="search-form">
        <input id="query" type="text" autocomplete="off"
               placeholder="Address, station, or lat, lon" aria-label="Location">
        <button type="submit">Search</button>
      </form>
    </div>
    <div class="results" id="results"></div>
  </div>

  <div id="location-note"></div>
</header>

<div id="map"></div>
<div id="route-banner" hidden></div>

<main id="stations"></main>

<footer>
  <span class="dot" id="dot"></span>
  <span id="status">Connecting to MTA&hellip;</span>
</footer>

<div id="focus" hidden>
  <div class="focus-now">
    <span id="focus-now"></span>
    <span id="focus-weather" class="weather" hidden></span>
  </div>
  <div class="focus-label" id="focus-label">Leave in</div>
  <div class="focus-timer" id="focus-timer">--:--</div>
  <div class="focus-line" id="focus-line"></div>
  <div class="focus-sub" id="focus-sub"></div>
  <div class="focus-checklist" id="focus-checklist" hidden></div>
  <div class="focus-modes" id="focus-modes"></div>
  <div id="focus-map"></div>
  <div class="focus-note" id="focus-note"></div>
  <div class="focus-math" id="focus-math"></div>
  <button id="focus-exit">End session</button>
</div>

<script>
  // Official line colors, so a station's badges read the way the signage does.
  const ROUTE_COLORS = {
    1: '#ee352e', 2: '#ee352e', 3: '#ee352e',
    4: '#00933c', 5: '#00933c', 6: '#00933c',
    7: '#b933ad',
    A: '#0039a6', C: '#0039a6', E: '#0039a6',
    B: '#ff6319', D: '#ff6319', F: '#ff6319', M: '#ff6319',
    G: '#6cbe45',
    J: '#996633', Z: '#996633',
    N: '#fccc0a', Q: '#fccc0a', R: '#fccc0a', W: '#fccc0a',
    L: '#a7a9ac',
    S: '#808183', SIR: '#0078c6', SI: '#0078c6',
  };
  const DARK_TEXT = new Set(['N', 'Q', 'R', 'W', 'L', 'S']);

  const REFRESH_MS = 15_000;
  const PLACE_KEY = 'maujerdash:place';
  const CHECKLIST_KEY = 'maujerdash:checklist';

  // The app's namesake, shown until someone picks a location of their own.
  const DEFAULT_PLACE = {
    lat: 40.7118, lon: -73.943, label: 'Maujer St, Brooklyn', source: 'default',
  };

  // The place stays put once chosen — only the arrival times refresh.
  const state = {
    place: loadPlace(),
    locating: false,
    note: null,
    byId: new Map(),   // station id -> latest station payload
    selected: null,    // station whose route trail is drawn
    session: null,     // train being counted down to
    weather: null,     // current conditions at the chosen place
    mode: loadMode(),  // how you plan to reach the station
    checklist: loadChecklist(),  // things to grab before leaving
  };

  function loadMode() {
    const saved = localStorage.getItem('maujerdash:mode');
    return ['walk', 'bike', 'drive'].includes(saved) ? saved : 'walk';
  }

  function setMode(mode) {
    if (state.mode === mode) return;
    state.mode = mode;
    try { localStorage.setItem('maujerdash:mode', mode); } catch {}
    renderModes();
    refresh();
  }

  function renderModes() {
    for (const button of $('modes').querySelectorAll('button')) {
      button.setAttribute('aria-pressed', String(button.dataset.mode === state.mode));
    }
  }

  // --- Leaving checklist -----------------------------------------
  function loadChecklist() {
    try {
      const saved = JSON.parse(localStorage.getItem(CHECKLIST_KEY));
      return Array.isArray(saved) ? saved.filter(i => i && typeof i.text === 'string') : [];
    } catch {
      return [];
    }
  }

  function saveChecklist() {
    try { localStorage.setItem(CHECKLIST_KEY, JSON.stringify(state.checklist)); } catch {}
  }

  let checklistSeq = 0;
  const nextCheckId = () => `c${Date.now()}-${checklistSeq++}`;

  function addChecklistItem(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    state.checklist.push({ id: nextCheckId(), text: trimmed, checked: false });
    saveChecklist();
    renderChecklist();
  }

  function toggleChecklistItem(id) {
    const item = state.checklist.find(i => i.id === id);
    if (!item) return;
    item.checked = !item.checked;
    saveChecklist();
    renderChecklist();
  }

  function removeChecklistItem(id) {
    state.checklist = state.checklist.filter(i => i.id !== id);
    saveChecklist();
    renderChecklist();
  }

  function renderChecklist() {
    const items = state.checklist;
    const remaining = items.filter(i => !i.checked).length;

    const badge = $('check-badge');
    badge.textContent = remaining;
    badge.hidden = remaining === 0;

    $('check-list').innerHTML = items.length
      ? items.map(item => `
          <label class="check-item${item.checked ? ' done' : ''}">
            <input type="checkbox" data-id="${esc(item.id)}" ${item.checked ? 'checked' : ''}>
            <span>${esc(item.text)}</span>
            <button type="button" data-remove="${esc(item.id)}" title="Remove">&times;</button>
          </label>`).join('')
      : `<div class="check-empty">Nothing on the list yet — add what you don't want to forget</div>`;

    renderFocusChecklist();
  }

  function toggleChecklistPanel() {
    const panel = $('checklist-panel');
    const open = panel.hidden;
    panel.hidden = !open;
    $('checklist-toggle').setAttribute('aria-expanded', String(open));
    if (open) $('check-input').focus({ preventScroll: true });
  }

  // The reminder that matters most right when you're about to walk out. Each
  // chip is tappable, so things get ticked off without leaving the countdown.
  function renderFocusChecklist() {
    const el = $('focus-checklist');
    const items = state.checklist;

    el.hidden = !items.length;
    if (el.hidden) return;

    el.innerHTML = `<span class="grab-label">Grab</span>` +
      items.map(item =>
        `<button type="button" data-grab="${esc(item.id)}"
                 class="${item.checked ? 'grabbed' : ''}"
                 title="${item.checked ? 'Grabbed — tap to undo' : 'Tap once you have it'}"
                 >${esc(item.text)}</button>`).join('');
  }

  const $ = id => document.getElementById(id);

  function loadPlace() {
    try {
      const saved = JSON.parse(localStorage.getItem(PLACE_KEY));
      return Number.isFinite(saved?.lat) && Number.isFinite(saved?.lon) ? saved : null;
    } catch {
      return null;
    }
  }

  function setPlace(place) {
    state.place = place;
    state.note = null;
    try {
      localStorage.setItem(PLACE_KEY, JSON.stringify(place));
    } catch {
      state.note = 'This location could not be saved for next time';
    }
    closePicker();
    clearRoute();
    renderPlace();
    refresh();
    loadWeather();
  }

  // Clock
  function tick() {
    const now = new Date();
    const time = now.toLocaleTimeString('en-US', {
      hour: 'numeric', minute: '2-digit', second: '2-digit',
    });
    $('clock').textContent =
      now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) +
      ' · ' + time;
    $('focus-now').textContent = time;
  }
  tick();
  setInterval(tick, 1000);

  // Geolocation — asked for on demand, never on a timer.
  function requestLocation() {
    return new Promise(resolve => {
      if (!navigator.geolocation) {
        state.note = 'This browser has no location support';
        return resolve(null);
      }
      if (!window.isSecureContext) {
        state.note = 'Location needs https (or localhost) — search for a place instead';
        return resolve(null);
      }

      state.locating = true;
      renderPlace();
      navigator.geolocation.getCurrentPosition(
        pos => {
          state.locating = false;
          state.note = null;
          resolve({
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            label: 'my location',
            source: 'device',
            accuracy: Math.round(pos.coords.accuracy),
          });
        },
        err => {
          state.locating = false;
          state.note = err.code === err.PERMISSION_DENIED
            ? 'Location permission denied — search for a place instead'
            : 'Could not get your location';
          resolve(null);
        },
        { enableHighAccuracy: true, timeout: 10_000, maximumAge: 60_000 }
      );
    });
  }

  function renderPlace(data) {
    const label = $('place-label');
    const note = $('location-note');
    const place = state.place ?? DEFAULT_PLACE;

    if (state.locating) {
      $('place-prefix').hidden = true;
      label.className = 'place-label';
      label.textContent = 'Locating…';
      label.removeAttribute('title');
    } else {
      $('place-prefix').hidden = false;
      label.className = place.source === 'default' ? 'place-label default' : 'place-label';
      label.textContent = place.label;
      // Coordinates and GPS accuracy are detail, not headline: keep them on hover.
      const accuracy = place.accuracy ? ` (accurate to about ${place.accuracy} m)` : '';
      label.title = `${place.lat.toFixed(5)}, ${place.lon.toFixed(5)}${accuracy}`;
    }

    const messages = [];
    if (state.note) messages.push(state.note);
    if (data?.expandedSearch) messages.push('Nothing in range — showing the closest stations');
    note.className = messages.length ? 'warn' : '';
    note.textContent = messages.join(' · ');
  }

  // Rendering
  function formatDistance(miles) {
    const feet = miles * 5280;
    if (feet < 1000) return `${Math.round(feet / 10) * 10} ft`;
    return `${miles.toFixed(miles < 10 ? 1 : 0)} mi`;
  }

  function badge(route, express) {
    const color = ROUTE_COLORS[route] || '#808183';
    const text = DARK_TEXT.has(route) ? '#000' : '#fff';
    return `<span class="badge${express ? ' express' : ''}" style="background:${color};color:${text}">` +
           `<span>${esc(route)}</span></span>`;
  }

  const MODES = ['walk', 'bike', 'drive'];
  const MODE_PHRASE = { walk: 'on foot', bike: 'by bike', drive: 'by car' };
  const MODE_LABEL = { walk: 'Walk', bike: 'Bike', drive: 'Drive' };

  function stationMeta(station) {
    // Pinning a station puts you on top of it; "0 ft" alone reads better there.
    if (station.distanceMiles * 5280 < 50) return 'Right here';
    return formatDistance(station.distanceMiles);
  }

  function renderTravel(station) {
    const travel = station.travel;
    if (!travel) return '';
    const note = travel.estimated ? ' (estimated, routing unavailable)' : ' by street route';
    // The chosen method is the headline; the other two stay on the tooltip.
    const detail = MODES.map(m => `${travel[m]} min ${m}`).join(' · ') +
      ` — ${travel.streetMiles} mi${note}`;
    return `<div class="travel" title="${esc(detail)}">` +
           `<b>${travel[state.mode]} min</b> ${state.mode}</div>`;
  }

  // A train 20 minutes out shows a full circle; it drains and reddens from there.
  const FULL_MINUTES = 20;

  function liquid(minutes) {
    const remaining = Math.max(0, Math.min(1, minutes / FULL_MINUTES));
    return {
      fill: `${Math.max(7, remaining * 100).toFixed(0)}%`,   // keep a sliver visible at zero
      color: `hsl(${(120 * remaining).toFixed(0)} 72% 42%)`, // 120 green -> 0 red
    };
  }

  function renderTrain(train, index, station, dirCode) {
    const { fill, color } = liquid(train.minutesAway);
    const arriving = train.minutesAway <= 0;
    const time = arriving ? 'Now' : train.minutesAway;
    const name = train.express ? `${train.route} express` : train.route;
    const usable = modesThatMake(train, station);
    const catchable = usable.includes(state.mode);

    const where = train.destination ? `${name} to ${train.destination}` : name;
    const when = arriving ? 'arriving' : `in ${train.minutesAway} min`;
    const title = catchable
      ? `${where} ${when} — you can make it ${MODE_PHRASE[state.mode]}`
      : usable.length
        ? `${where} ${when} — too soon ${MODE_PHRASE[state.mode]}, but you could make it ${usable.map(m => MODE_PHRASE[m]).join(' / ')}`
        : `${where} ${when} — too soon to make it from here`;

    return `<span class="train${catchable ? '' : ' missed'}"
                  style="--fill:${fill};--liquid:${color}" title="${esc(title)}"
                  data-station="${esc(station.id)}" data-dir="${dirCode}" data-index="${index}">
              <span class="liquid"></span>
              <span class="train-time${arriving ? ' now' : ''}">${time}</span>
              <span class="train-route${train.express ? ' express' : ''}">${esc(train.route)}</span>
            </span>`;
  }

  function renderDirection(direction, station) {
    const destinations = [...new Set(direction.trains.map(t => t.destination).filter(Boolean))];
    const heading = destinations.length
      ? `${direction.label} <span class="dir-dest">to ${esc(destinations.slice(0, 2).join(', '))}</span>`
      : direction.label;
    const trains = direction.trains.length
      ? direction.trains.map((t, i) => renderTrain(t, i, station, direction.code)).join('')
      : '<span class="empty">No trains scheduled</span>';
    return `<div class="dir-section">
              <div class="dir-label">${direction.code === 'N' ? '↑' : '↓'} ${heading}</div>
              <div class="trains">${trains}</div>
            </div>`;
  }

  function renderStation(station, index) {
    return `<section class="station" id="station-${esc(station.id)}" data-id="${esc(station.id)}">
              <div class="station-head">
                <div class="badges">${station.routes.map(route => badge(route)).join('')}</div>
                <div>
                  <div class="station-name">${esc(station.name)}</div>
                  <div class="station-meta">${stationMeta(station)}</div>
                  ${renderTravel(station)}
                </div>
                <div class="rank">#${index + 1}</div>
              </div>
              <div class="station-dirs">${station.directions.map(d => renderDirection(d, station)).join('')}</div>
            </section>`;
  }

  function esc(text) {
    return String(text).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Weather — refreshed on its own slow clock, and whenever the place moves.
  const WEATHER_REFRESH_MS = 10 * 60_000;

  function renderWeather() {
    const weather = state.weather;
    const text = weather ? `${weather.icon} ${weather.temperature}° ${weather.description}` : '';
    const detail = weather
      ? `Feels like ${weather.feelsLike}° · wind ${weather.windMph} mph` +
        (weather.precipitation ? ` · ${weather.precipitation}" precipitation` : '')
      : '';

    for (const id of ['weather', 'focus-weather']) {
      const el = $(id);
      el.textContent = text;
      el.hidden = !weather;
    }
    $('weather').title = weather ? `${detail} — click for today's forecast` : '';
    $('focus-weather').title = detail;

    if (!weather) $('wx-panel').hidden = true;
    else if (!$('wx-panel').hidden) renderForecast();
  }

  // The day's hours as a strip: bar height maps the temperature across the
  // day's own range, so a flat day reads flat rather than exaggerated.
  function renderForecast() {
    const weather = state.weather;
    if (!weather?.hourly?.length) return;

    const temps = weather.hourly.map(h => h.temperature);
    const low = Math.min(...temps);
    const high = Math.max(...temps);
    // Percentage of the track: equal temperatures give equal bars, and only a
    // warmer hour raises one. The floor keeps the coldest hour visible.
    const barHeight = t => (high === low ? 50 : 12 + ((t - low) / (high - low)) * 88);

    $('wx-panel').innerHTML = `
      <div class="wx-head">
        <span class="wx-temp">${weather.icon} ${weather.temperature}°</span>
        <span>${esc(weather.description)}</span>
        <span class="muted">Feels ${weather.feelsLike}° · High ${weather.today.high}° ·
          Low ${weather.today.low}° · Wind ${weather.windMph} mph</span>
        <span class="muted">Sunrise ${esc(weather.today.sunrise ?? '—')} ·
          Sunset ${esc(weather.today.sunset ?? '—')}</span>
      </div>
      <div class="wx-hours">${weather.hourly.map(hour => `
        <div class="wx-hour${hour.isNow ? ' now' : ''}"
             title="${esc(`${hour.label} · ${hour.description} · ${hour.precipChance}% chance of rain`)}">
          <span class="wx-temp-h">${hour.temperature}°</span>
          <span class="wx-track"><span class="wx-bar"
                style="height:${barHeight(hour.temperature).toFixed(1)}%"></span></span>
          <span class="wx-icon">${hour.icon}</span>
          <span class="wx-label">${esc(hour.label)}</span>
          <span class="wx-precip">${hour.precipChance > 0
            ? `<span class="wx-drop">💧</span>${hour.precipChance}%` : ''}</span>
        </div>`).join('')}</div>`;

    $('wx-panel').querySelector('.wx-hour.now')
      ?.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  function toggleForecast() {
    const panel = $('wx-panel');
    const open = panel.hidden;
    panel.hidden = !open;
    $('weather').setAttribute('aria-expanded', String(open));
    if (open) renderForecast();
  }

  async function loadWeather() {
    const place = state.place ?? DEFAULT_PLACE;
    try {
      const res = await fetch(`/api/weather?lat=${place.lat}&lon=${place.lon}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      state.weather = await res.json();
    } catch {
      state.weather = null;   // the board matters more than the forecast
    }
    renderWeather();
  }

  // Map
  const MILES_TO_METERS = 1609.34;
  const map = {
    instance: null,
    circle: null,
    origin: null,
    pins: new Map(),      // station id -> marker
    view: null,           // last {lat, lon, radius} the view was fitted to
  };

  function initMap() {
    if (map.instance || typeof L === 'undefined') return;

    // Integer zoom only. Fractional zoom (zoomSnap: 0) fits the radius circle
    // more tightly, but it scales every tile — measured 319px for a 256px tile —
    // and a blurry basemap is a worse trade than a slightly loose fit.
    map.instance = L.map('map', { zoomControl: true, attributionControl: true });
    // Standard OSM tiles need no API key; CSS inverts them to match the board.
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map.instance);
    map.instance.setView([DEFAULT_PLACE.lat, DEFAULT_PLACE.lon], 15);
    // Also covers the container starting at zero size while hidden (a
    // background tab): the fit reruns when it gains a real width.
    new ResizeObserver(scheduleFit).observe(document.getElementById('map'));
  }

  // Frame whatever is currently the subject: the route trail if one is drawn,
  // otherwise the search radius.
  function fitToSubject() {
    const subject = map.trail ?? map.circle;
    if (!map.instance || !subject) return;

    // A container with no size (the page loaded in a background tab) makes
    // fitBounds pick the maximum zoom. Wait for a real measurement instead.
    const el = document.getElementById('map');
    if (!el.clientWidth || !el.clientHeight) {
      clearTimeout(fitTimer);
      fitTimer = setTimeout(fitToSubject, 500);
      return;
    }

    map.instance.invalidateSize();
    map.instance.fitBounds(subject.getBounds(), { padding: [12, 12] });
    map.fitted = true;
  }

  // Fitting depends on the container's measured size, so drive it off the
  // element itself. A ResizeObserver fires once on observe and again on every
  // later resize, which covers both the initial fit and window changes —
  // window.resize and requestAnimationFrame both missed cases here.
  let fitTimer;
  function scheduleFit() {
    clearTimeout(fitTimer);
    fitTimer = setTimeout(fitToSubject, 80);
  }

  // Coming back to a backgrounded tab is the other way the container goes from
  // unmeasurable to real, and it does not always surface as a resize.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') scheduleFit();
  });

  function highlight(stationId, on) {
    map.pins.get(stationId)?.getElement()?.classList.toggle('active', on);
    document.getElementById(`station-${stationId}`)?.classList.toggle('active', on);
  }

  function pinPopup(station) {
    const lines = station.directions.map(direction => {
      const next = direction.trains[0];
      const when = !next ? 'none scheduled'
        : next.minutesAway <= 0 ? `${next.route} now`
        : `${next.route} in ${next.minutesAway} min`;
      return `${direction.code === 'N' ? '↑' : '↓'} ${esc(direction.label)}: ${esc(when)}`;
    });
    return `<b>${esc(station.name)}</b><br>${esc(stationMeta(station))}<br>${lines.join('<br>')}`;
  }

  function renderMap(data) {
    initMap();
    if (!map.instance) return;

    const { lat, lon } = data.origin;
    const radiusMeters = data.radiusMiles * MILES_TO_METERS;

    if (map.origin) map.origin.setLatLng([lat, lon]);
    else {
      map.origin = L.marker([lat, lon], {
        icon: L.divIcon({ className: '', html: '<div class="origin-dot"></div>', iconSize: [14, 14] }),
        interactive: false,
      }).addTo(map.instance);
    }

    if (map.circle) map.circle.setLatLng([lat, lon]).setRadius(radiusMeters);
    else {
      map.circle = L.circle([lat, lon], {
        radius: radiusMeters,
        color: '#3b82f6',
        weight: 1,
        fillColor: '#3b82f6',
        fillOpacity: 0.07,
      }).addTo(map.instance);
    }

    // Reuse pins across refreshes so the map doesn't flicker every 15s.
    const seen = new Set();
    for (const station of data.stations) {
      seen.add(station.id);
      const badges = station.routes.map(route => badge(route)).join('');
      let pin = map.pins.get(station.id);
      if (!pin) {
        pin = L.marker([station.lat, station.lon], {
          icon: L.divIcon({
            className: 'station-pin',
            html: `<div class="pin-inner">${badges}</div>`,
            iconSize: null,
          }),
        }).addTo(map.instance);
        pin.on('click', () => {
          showRoute(station.id);
          document.getElementById(`station-${station.id}`)
            ?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        pin.on('mouseover', () => highlight(station.id, true));
        pin.on('mouseout', () => highlight(station.id, false));
        map.pins.set(station.id, pin);
      }
      pin.bindPopup(pinPopup(station));
    }

    for (const [id, pin] of map.pins) {
      if (seen.has(id)) continue;
      pin.remove();
      map.pins.delete(id);
    }

    // Only refit when the place or radius actually changed, so panning sticks.
    const view = `${lat},${lon},${data.radiusMiles}`;
    if (map.view !== view) {
      map.view = view;
      map.fitted = false;
      scheduleFit();
    } else if (!map.fitted) {
      // A fit that never landed (container still unmeasurable) gets another go
      // on every refresh, so the view always converges.
      scheduleFit();
    }
  }

  function wireCardHighlights() {
    document.querySelectorAll('.station').forEach(card => {
      const id = card.dataset.id;
      // Clicking a train traces the route and opens its focus session; clicking
      // anywhere else on the row just traces the route.
      card.addEventListener('click', event => {
        const train = event.target.closest('.train');
        if (train && !train.classList.contains('missed')) {
          showRoute(id, false);
          startSession(id, train.dataset.dir, Number(train.dataset.index));
          return;
        }
        if (!train) showRoute(id);
      });
      card.addEventListener('mouseenter', () => highlight(id, true));
      card.addEventListener('mouseleave', () => highlight(id, false));
    });
    if (state.selected) markSelected();
  }

  // --- Focus session -------------------------------------------
  // Getting to the platform takes longer than getting to the station door, so
  // the deadline is the arrival minus the walk minus a fixed buffer.
  const LEAVE_BUFFER_MIN = 2;

  function leaveDeadline(train, station, mode) {
    const travel = station?.travel?.[mode] ?? 0;
    return train.arrivalTime * 1000 - (travel + LEAVE_BUFFER_MIN) * 60_000;
  }

  // MODES runs walk, bike, drive — slowest first — so the first entry that
  // still makes it is the simplest way to catch this train.
  function modesThatMake(train, station) {
    return MODES.filter(mode => leaveDeadline(train, station, mode) > Date.now());
  }

  // The board answers for the method you picked, so a train is only shown as
  // reachable if that method makes it.
  function isCatchable(train, station) {
    return leaveDeadline(train, station, state.mode) > Date.now();
  }

  function clock(ms) {
    const total = Math.max(0, Math.round(ms / 1000));
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, '0')}`;
  }

  function startSession(stationId, dirCode, index) {
    const station = state.byId.get(stationId);
    const train = station?.directions.find(d => d.code === dirCode)?.trains[index];
    if (!station || !train) return;
    const usable = modesThatMake(train, station);
    if (!usable.length) return;

    state.session = {
      stationId,
      dirCode,
      route: train.route,
      express: train.express,
      destination: train.destination,
      arrivalTime: train.arrivalTime,
      // Honour the board's method when it still makes the train.
      mode: usable.includes(state.mode) ? state.mode : usable[0],
    };
    $('focus').hidden = false;
    renderSession();
    showFocusRoute(station);
  }

  function endSession() {
    state.session = null;
    $('focus').hidden = true;
  }

  function setSessionMode(mode) {
    if (!state.session) return;
    state.session.mode = mode;
    renderSession();
  }

  // --- Session map ---------------------------------------------
  const focusMap = { instance: null, trail: null, marker: null, fitted: false };

  function ensureFocusMap() {
    if (focusMap.instance || typeof L === 'undefined') return;
    focusMap.instance = L.map('focus-map', {
      zoomControl: false,
      attributionControl: true,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false,
      boxZoom: false,
      keyboard: false,
      touchZoom: false,
    });
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
      maxZoom: 19,
    }).addTo(focusMap.instance);
    focusMap.instance.setView([DEFAULT_PLACE.lat, DEFAULT_PLACE.lon], 15);
  }

  // The overlay is hidden until a session starts, so the container has no size
  // when the map is created — same convergence guard as the main map.
  function fitFocusMap() {
    const el = $('focus-map');
    if (!focusMap.instance || !focusMap.trail) return;
    if (!el.clientWidth || !el.clientHeight) {
      setTimeout(fitFocusMap, 200);
      return;
    }
    focusMap.instance.invalidateSize();
    focusMap.instance.fitBounds(focusMap.trail.getBounds(), { padding: [22, 22] });
    focusMap.fitted = true;
  }

  async function showFocusRoute(station) {
    ensureFocusMap();
    if (!focusMap.instance) return;

    const place = state.place ?? DEFAULT_PLACE;
    const params = new URLSearchParams({
      lat: place.lat, lon: place.lon, toLat: station.lat, toLon: station.lon,
    });

    try {
      const res = await fetch(`/api/route?${params}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const { geometry } = await res.json();
      if (!state.session || state.session.stationId !== station.id) return;

      focusMap.trail?.remove();
      focusMap.trail = L.polyline(
        geometry.coordinates.map(([lon, lat]) => [lat, lon]),
        { color: '#3b82f6', weight: 5, opacity: 0.9, lineJoin: 'round' }
      ).addTo(focusMap.instance);

      focusMap.marker?.remove();
      focusMap.marker = L.marker([place.lat, place.lon], {
        icon: L.divIcon({ className: '', html: '<div class="origin-dot"></div>', iconSize: [14, 14] }),
        interactive: false,
      }).addTo(focusMap.instance);

      focusMap.fitted = false;
      fitFocusMap();
      $('focus-note').textContent =
        'Street route — the routing service only provides driving geometry';
    } catch (err) {
      $('focus-note').textContent = `Could not draw the route: ${err.message}`;
    }
  }

  // Re-match the same trip after a refresh so delays move the deadline.
  function syncSession() {
    const session = state.session;
    if (!session) return;
    const dir = state.byId.get(session.stationId)
      ?.directions.find(d => d.code === session.dirCode);
    const match = dir?.trains.find(t =>
      t.route === session.route && Math.abs(t.arrivalTime - session.arrivalTime) <= 180);
    if (match) session.arrivalTime = match.arrivalTime;
  }

  function renderSession() {
    const session = state.session;
    if (!session) return;

    const station = state.byId.get(session.stationId);
    const mode = session.mode;
    const travel = station?.travel?.[mode] ?? 0;
    const untilLeave = leaveDeadline(session, station, mode) - Date.now();
    const untilTrain = session.arrivalTime * 1000 - Date.now();

    // One button per mode, each showing what that choice costs you. This runs
    // every second, so only touch the DOM when something actually changed.
    const buttons = $('focus-modes');
    const key = MODES
      .map(m => `${station?.travel?.[m]}:${leaveDeadline(session, station, m) > Date.now()}`)
      .join('|') + `|${mode}`;
    if (buttons.dataset.key !== key) {
      buttons.dataset.key = key;
      buttons.innerHTML = MODES.map(m => {
        const minutes = station?.travel?.[m] ?? 0;
        const makesIt = leaveDeadline(session, station, m) > Date.now();
        return `<button data-mode="${m}" aria-pressed="${m === mode}"${makesIt ? '' : ' disabled'}
                        title="${makesIt ? '' : 'Too late to make this train ' + MODE_PHRASE[m]}">` +
               `${MODE_LABEL[m]} <b>${minutes}</b></button>`;
      }).join('');
    }

    const timer = $('focus-timer');
    const label = $('focus-label');

    if (untilTrain <= 0) {
      label.textContent = 'Departed';
      timer.className = 'focus-timer gone';
      timer.textContent = 'Train has gone';
    } else if (untilLeave <= 0) {
      label.textContent = 'Leave';
      timer.className = 'focus-timer go';
      timer.textContent = 'NOW';
    } else {
      label.textContent = 'Leave in';
      timer.className = untilLeave <= 120_000 ? 'focus-timer soon' : 'focus-timer';
      timer.textContent = clock(untilLeave);
    }

    // Reads as one sentence around the big number: "Leave in 7:29 to arrive at
    // Grand St to catch the L train to 8 Av".
    const stationName = esc(station?.name ?? '');
    const routeBadge = badge(session.route, session.express);
    const towards = session.destination ? ` to ${esc(session.destination)}` : '';
    $('focus-line').innerHTML = untilTrain <= 0
      ? `<span>the ${routeBadge} train${towards} has left <b>${stationName}</b></span>`
      : `<span>to arrive at <b>${stationName}</b> to catch the</span>` +
        `${routeBadge}<span>train${towards}</span>`;

    const arrival = new Date(session.arrivalTime * 1000);
    const arrivalClock = arrival.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    $('focus-sub').textContent = `Train arrives ${arrivalClock}`;
    $('focus-math').textContent =
      `${travel} min ${MODE_PHRASE[mode]} + ${LEAVE_BUFFER_MIN} min to the platform` +
      ` · train in ${clock(Math.max(0, untilTrain))}`;
  }

  setInterval(renderSession, 1000);

  // --- Route trail ---------------------------------------------
  function markSelected() {
    document.querySelectorAll('.station').forEach(card => {
      card.classList.toggle('selected', card.dataset.id === state.selected);
    });
  }

  function clearRoute() {
    state.selected = null;
    map.trail?.remove();
    map.trail = null;
    $('route-banner').hidden = true;
    markSelected();
    scheduleFit();   // back to framing the radius
  }

  function drawTrail(geometry) {
    // GeoJSON is [lon, lat]; Leaflet wants [lat, lon].
    const points = geometry.coordinates.map(([lon, lat]) => [lat, lon]);
    map.trail?.remove();
    map.trail = L.polyline(points, {
      color: '#3b82f6',
      weight: 5,
      opacity: 0.9,
      lineJoin: 'round',
    }).addTo(map.instance);
    scheduleFit();
  }

  // toggle: clicking the row again clears the trail. Train clicks pass false —
  // picking a second train at the same station should keep the route drawn.
  async function showRoute(stationId, toggle = true) {
    const station = state.byId.get(stationId);
    if (!station) return;
    if (state.selected === stationId) {
      if (toggle) clearRoute();
      return;
    }

    state.selected = stationId;
    markSelected();

    const banner = $('route-banner');
    banner.hidden = false;
    banner.className = '';
    banner.textContent = `Routing to ${station.name}…`;

    const place = state.place ?? DEFAULT_PLACE;
    const params = new URLSearchParams({
      lat: place.lat, lon: place.lon, toLat: station.lat, toLon: station.lon,
    });

    try {
      const res = await fetch(`/api/route?${params}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (state.selected !== stationId) return;   // superseded by another click

      drawTrail(data.geometry);
      banner.className = '';
      banner.innerHTML =
        `<span><b>${esc(station.name)}</b>: ` +
        `${data.travel[state.mode]} min ${MODE_PHRASE[state.mode]}</span>` +
        `<span class="muted">${data.travel.streetMiles} mi street route</span>` +
        `<button id="clear-route">Clear</button>`;
      $('clear-route').addEventListener('click', event => {
        event.stopPropagation();
        clearRoute();
      });
    } catch (err) {
      banner.className = 'warn';
      banner.textContent = `Could not trace a route to ${station.name}: ${err.message}`;
    }
  }

  // Data fetch — only the trains refresh; the place stays where it was set.
  async function refresh() {
    const place = state.place ?? DEFAULT_PLACE;
    const params = new URLSearchParams({
      lat: place.lat,
      lon: place.lon,
      radius: $('radius').value,
      limit: 10,
    });

    const dot = $('dot');
    const status = $('status');
    try {
      const res = await fetch(`/api/nearby?${params}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      state.byId = new Map(data.stations.map(station => [station.id, station]));
      if (state.selected && !state.byId.has(state.selected)) clearRoute();
      syncSession();

      $('stations').innerHTML = data.stations.length
        ? data.stations.map(renderStation).join('')
        : '<section class="station"><div class="dir-section"><span class="empty">No stations found</span></div></section>';
      wireCardHighlights();
      renderMap(data);
      renderPlace(data);

      dot.className = 'dot ok';
      const stale = data.feedErrors?.length
        ? ` · ${data.feedErrors.length} feed(s) delayed`
        : '';
      status.textContent = 'Updated ' + new Date(data.updatedAt).toLocaleTimeString() + stale;
    } catch (err) {
      dot.className = 'dot err';
      status.textContent = 'Error: ' + err.message;
    }
  }

  // Location picker
  function openPicker() {
    $('picker').hidden = false;
    // preventScroll: on first load the picker opens by itself, and a focus that
    // scrolls would push the header off screen.
    $('query').focus({ preventScroll: true });
  }

  function closePicker() {
    $('picker').hidden = true;
    $('results').innerHTML = '';
    $('query').value = '';
  }

  function renderResults(results) {
    $('results').innerHTML = results.length
      ? results.map((r, i) =>
          `<button class="result" data-index="${i}">
             <span class="kind">${r.source}</span>${esc(r.label)}
           </button>`).join('')
      : '<span class="empty">Nothing found — try an address, a station, or "40.7118, -73.943"</span>';

    $('results').querySelectorAll('.result').forEach(button => {
      button.addEventListener('click', () => {
        const { lat, lon, label } = results[Number(button.dataset.index)];
        setPlace({ lat, lon, label, source: 'search' });
      });
    });
  }

  async function search(query) {
    $('results').innerHTML = '<span class="empty">Searching…</span>';
    try {
      const res = await fetch(`/api/geocode?q=${encodeURIComponent(query)}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      renderResults(data.results);
    } catch (err) {
      $('results').innerHTML = `<span class="empty">Search failed: ${esc(err.message)}</span>`;
    }
  }

  // Wiring
  const savedRadius = localStorage.getItem('maujerdash:radius');
  if (savedRadius) $('radius').value = savedRadius;

  $('radius').addEventListener('change', () => {
    localStorage.setItem('maujerdash:radius', $('radius').value);
    clearRoute();
    refresh();
  });

  $('modes').addEventListener('click', event => {
    const button = event.target.closest('button[data-mode]');
    if (button) setMode(button.dataset.mode);
  });

  $('weather').addEventListener('click', toggleForecast);

  renderChecklist();
  $('checklist-toggle').addEventListener('click', toggleChecklistPanel);
  $('check-form').addEventListener('submit', event => {
    event.preventDefault();
    addChecklistItem($('check-input').value);
    $('check-input').value = '';
  });
  $('check-list').addEventListener('change', event => {
    const box = event.target.closest('input[type="checkbox"]');
    if (box) toggleChecklistItem(box.dataset.id);
  });
  $('check-list').addEventListener('click', event => {
    const button = event.target.closest('button[data-remove]');
    if (button) removeChecklistItem(button.dataset.remove);
  });
  $('focus-checklist').addEventListener('click', event => {
    const chip = event.target.closest('button[data-grab]');
    if (chip) toggleChecklistItem(chip.dataset.grab);
  });

  $('focus-exit').addEventListener('click', endSession);
  $('focus-modes').addEventListener('click', event => {
    const button = event.target.closest('button[data-mode]');
    if (button && !button.disabled) setSessionMode(button.dataset.mode);
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && state.session) endSession();
  });

  $('change').addEventListener('click', () => {
    if ($('picker').hidden) openPicker();
    else closePicker();
  });

  $('locate').addEventListener('click', async () => {
    $('locate').disabled = true;
    const fix = await requestLocation();
    $('locate').disabled = false;
    if (fix) setPlace(fix);
    else renderPlace();
  });

  $('search-form').addEventListener('submit', event => {
    event.preventDefault();
    const query = $('query').value.trim();
    if (query) search(query);
  });

  (async () => {
    // Ask once on a first visit; after that the saved place is used as-is.
    if (!state.place) {
      const fix = await requestLocation();
      if (fix) {
        state.place = fix;
        try { localStorage.setItem(PLACE_KEY, JSON.stringify(fix)); } catch {}
      } else {
        openPicker();
      }
    }
    renderModes();
    renderPlace();
    refresh();
    setInterval(refresh, REFRESH_MS);
    loadWeather();
    setInterval(loadWeather, WEATHER_REFRESH_MS);
  })();
</script>
</body>
</html>
